<!DOCTYPE html>
<html>

<head>
<title>Citizen Emergency Report</title>
</head>

<body>

<h1>🚨 Report Emergency</h1>

<p>Describe the situation:</p>

<textarea id="description" rows="5" cols="40"></textarea>

<br><br>

<button onclick="sendReport()">
Send Emergency Report
</button>


<script>

function sendReport(){

    let description =
    document.getElementById("description").value;

    alert(
    "Report received:\n" + description
    );

}

</script>


</body>

</html>
